[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-document-qa"
version = "0.1.0"
description = "Hybrid RAG portfolio demo with local embeddings and persistent vector retrieval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "pydantic>=2.5,<3", "uvicorn[standard]>=0.27,<1", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
documents = ["pypdf>=4,<7", "python-docx>=1.1,<2"]
semantic = ["sentence-transformers>=3,<4", "qdrant-client>=1.9,<1.14"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
